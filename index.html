<!doctype html>
<html lang="zh-CN">
  <head>
    <!--
  牛来大冒险 3D · I Wanna Be The Ox · v3.0.0
  Copyright (c) 2026 MCapricorns — https://github.com/MCapricorns/niu-lai-3d

  文件结构: index.html(骨架) + three.min.js(引擎) + mapengine.js(地图引擎) + levels.js(大地图) + game.js(逻辑)
-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>牛来大冒险 3D · NIU LAI 3D</title>
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin />
    <link rel="stylesheet" href="https://fonts.loli.net/css2?family=ZCOOL+KuaiLe&display=swap" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0a12;
        height: 100%;
        overflow: hidden;
        font-family: "ZCOOL KuaiLe", "Yuanti SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      #wrap {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 16/10;
        width: 100%;
        height: auto;
      }
      #touch {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: none;
        pointer-events: none;
        z-index: 10;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 120ms ease,
          visibility 120ms ease;
      }
      #touch.touch-enabled {
        display: block;
      }
      #touch.touch-enabled.is-active {
        opacity: 1;
        visibility: visible;
      }
      .tbtn {
        pointer-events: auto;
        position: absolute;
        bottom: 14px;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.14);
        border: 2px solid rgba(255, 255, 255, 0.35);
        color: #fff;
        font-size: 22px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
        z-index: 11;
        box-sizing: border-box;
        padding: 0;
        font-family: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      #btnL {
        left: 14px;
      }
      #btnR {
        left: 118px;
      }
      #btnJ {
        right: 14px;
        bottom: 20px;
        width: 96px;
        height: 96px;
        background: rgba(255, 190, 60, 0.22);
      }
      #btnB {
        right: 126px;
        bottom: 80px;
        width: 74px;
        height: 74px;
        background: rgba(120, 220, 255, 0.18);
      }
      #btnP {
        right: 220px;
        bottom: 20px;
        width: 78px;
        height: 78px;
        background: rgba(255, 200, 120, 0.2);
      }
      .tbtn:active {
        background: rgba(255, 255, 255, 0.35);
      }
      /*
        竖屏时游戏画面放在顶部，按键在底部划成两个独立手区：
        左手移动；右手跳跃、冲刺、重击。所有间距都按最窄手机
        （320px）保留，避免按钮彼此遮挡或压住选关页。
      */
      /*
        按视口尺寸而不是 pointer: coarse 判断：少数 Chromium WebView
        会启用触摸事件却仍报告 fine pointer，按几何条件才能稳定避开重叠。
      */
      @media (max-width: 600px) and (orientation: portrait) {
        #wrap {
          align-items: flex-start;
          box-sizing: border-box;
          padding-top: max(12px, env(safe-area-inset-top));
        }
        canvas {
          width: 100vw;
          max-height: none;
        }
        .tbtn {
          bottom: calc(18px + env(safe-area-inset-bottom));
          width: 64px;
          height: 64px;
          font-size: 19px;
        }
        #btnL {
          left: calc(12px + env(safe-area-inset-left));
        }
        #btnR {
          left: calc(88px + env(safe-area-inset-left));
        }
        #btnJ {
          right: calc(12px + env(safe-area-inset-right));
          bottom: calc(18px + env(safe-area-inset-bottom));
          width: 82px;
          height: 82px;
          font-size: 21px;
        }
        #btnB {
          right: calc(102px + env(safe-area-inset-right));
          bottom: calc(27px + env(safe-area-inset-bottom));
          width: 56px;
          height: 56px;
          font-size: 16px;
        }
        #btnP {
          right: calc(12px + env(safe-area-inset-right));
          bottom: calc(112px + env(safe-area-inset-bottom));
          width: 56px;
          height: 56px;
          font-size: 16px;
        }
      }
      @media (max-width: 320px) and (orientation: portrait) {
        .tbtn {
          width: 56px;
          height: 56px;
        }
        #btnR {
          left: calc(76px + env(safe-area-inset-left));
        }
        #btnJ {
          right: calc(10px + env(safe-area-inset-right));
          width: 72px;
          height: 72px;
        }
        #btnB {
          right: calc(90px + env(safe-area-inset-right));
          width: 50px;
          height: 50px;
        }
        #btnP {
          right: calc(10px + env(safe-area-inset-right));
          bottom: calc(102px + env(safe-area-inset-bottom));
          width: 50px;
          height: 50px;
        }
      }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="cv" width="960" height="600"></canvas></div>
    <div id="touch">
      <button class="tbtn" id="btnL" type="button" aria-label="向左移动">◀</button>
      <button class="tbtn" id="btnR" type="button" aria-label="向右移动">▶</button>
      <button class="tbtn" id="btnB" type="button" aria-label="冲刺">跑</button>
      <button class="tbtn" id="btnJ" type="button" aria-label="跳跃">跳</button>
      <button class="tbtn" id="btnP" type="button" aria-label="坐地重击">坐</button>
    </div>
    <script src="three.min.js"></script>
    <script src="mapengine.js"></script>
    <script src="levels.js"></script>
    <script src="game.js"></script>
  </body>
</html>
