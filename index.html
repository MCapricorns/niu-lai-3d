<!doctype html>
<html lang="zh-CN">
  <head>
    <!--
  牛来大冒险 3D · Ox is Coming · v1.12.0
  Copyright (c) 2026 MCapricorns — https://github.com/MCapricorns/niu-lai-3d
  代码许可: MIT License (详见 LICENSE 文件)
  文件结构: index.html(骨架) + three.min.js(引擎) + mapengine.js(地图引擎) + levels.js(关卡) + game.js(逻辑)
-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>牛来大冒险 3D · NIU LAI 3D</title>
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin />
    <link rel="stylesheet" href="https://fonts.loli.net/css2?family=ZCOOL+KuaiLe&display=swap" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0a12;
        height: 100%;
        overflow: hidden;
        font-family: "ZCOOL KuaiLe", "Yuanti SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      #wrap {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 16/10;
        width: 100%;
        height: auto;
      }
      #touch {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: none;
        pointer-events: none;
        z-index: 10;
      }
      .tbtn {
        pointer-events: auto;
        position: absolute;
        bottom: 14px;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.14);
        border: 2px solid rgba(255, 255, 255, 0.35);
        color: #fff;
        font-size: 22px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
        z-index: 11;
      }
      #btnL {
        left: 14px;
      }
      #btnR {
        left: 118px;
      }
      #btnJ {
        right: 14px;
        bottom: 20px;
        width: 96px;
        height: 96px;
        background: rgba(255, 190, 60, 0.22);
      }
      #btnB {
        right: 126px;
        bottom: 80px;
        width: 74px;
        height: 74px;
        background: rgba(120, 220, 255, 0.18);
      }
      #btnP {
        right: 220px;
        bottom: 20px;
        width: 78px;
        height: 78px;
        background: rgba(255, 200, 120, 0.2);
      }
      #btnS {
        right: 220px;
        bottom: 106px;
        width: 70px;
        height: 70px;
        background: rgba(255, 255, 255, 0.18);
      }
      .tbtn:active {
        background: rgba(255, 255, 255, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="cv" width="960" height="600"></canvas></div>
    <div id="touch">
      <div class="tbtn" id="btnL">◀</div>
      <div class="tbtn" id="btnR">▶</div>
      <div class="tbtn" id="btnB">B</div>
      <div class="tbtn" id="btnJ">跳</div>
      <div class="tbtn" id="btnP">坐</div>
      <div class="tbtn" id="btnS">弹</div>
    </div>
    <script src="three.min.js"></script>
    <script src="mapengine.js"></script>
    <script src="levels.js"></script>
    <script src="game.js"></script>
  </body>
</html>
