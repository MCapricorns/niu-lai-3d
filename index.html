<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14243a" />
    <meta
      name="description"
      content="风暴击碎了星铃。跟着牛来闯过五个世界、二十五幕立体关卡，也可以观看 AI 自动闯关。"
    />
    <title>牛来大冒险 3D · 失落的星铃</title>
    <link rel="stylesheet" href="journey.css?v=5.0.0" />
  </head>
  <body>
    <main id="game" data-mode="title">
      <canvas id="journey-canvas" tabindex="-1" aria-label="牛来大冒险 3D 游戏画面"></canvas>
      <header class="hud-top">
        <div class="hud-stage">
          <p id="stage-name"></p>
          <progress id="stage-progress" max="100" value="0" aria-label="关卡进度"></progress>
        </div>
        <div class="hud-totals" aria-label="本关收集与失误">
          <div class="counter">
            <span class="coin-symbol" aria-hidden="true"></span><span id="coin-count">0</span
            ><span class="sr-only">金币</span>
          </div>
          <div class="counter">
            <span class="star-symbol" aria-hidden="true">✦</span><span id="star-count">0</span
            ><span class="sr-only">星星</span>
          </div>
          <div class="counter relay-counter" title="点亮全部信标即可开启星门">
            <span class="relay-symbol" aria-hidden="true"></span><span id="relay-count">0/2</span>
            <span class="sr-only">信标</span>
          </div>
          <div class="counter misses"><span id="death-count">0</span><span>失误</span></div>
        </div>
      </header>
      <div class="hud-actions">
        <button id="mute" class="utility" type="button" aria-pressed="false">声音开</button>
        <button id="pause" class="utility" type="button">暂停</button>
      </div>
      <div id="ai-controls" class="ai-controls" hidden>
        <span id="ai-label">AI 演示中</span>
        <button id="take-control" class="secondary" type="button">接管</button>
      </div>

      <div id="status" class="status" role="status"></div>
      <button id="return-relay" class="secondary goal-retry" type="button" hidden>返回寻找信标</button>
      <div class="hud-bottom">
        <p id="stage-tip"></p>
        <p class="keys"><kbd>WASD</kbd> 移动 <kbd>空格</kbd> 跳跃 <kbd>R</kbd> 重试</p>
      </div>
      <div class="touch-controls" aria-label="触屏操作">
        <button id="touch-move" type="button" aria-label="拖动控制移动"><span></span></button>
        <button id="touch-jump" type="button" aria-label="跳跃">跳</button>
      </div>

      <div class="scrim">
        <section id="title-panel" class="panel title-panel" aria-labelledby="game-title">
          <span class="version">v5.0.0</span>
          <h1 id="game-title">牛来大冒险 <span>3D</span></h1>
          <p class="story-name">失落的星铃</p>
          <p>风暴击碎了星铃。沿着五个世界的星光，帮牛来把黎明带回山谷。</p>
          <div class="menu-actions">
            <button id="start" class="primary" type="button">开始冒险</button>
            <button id="stage-select" class="secondary" type="button">选择关卡</button>
            <button id="ai-start" class="secondary" type="button">AI 演示</button>
          </div>
          <p class="control-guide">
            <span class="keyboard-guide">WASD 或方向键移动 · 空格跳跃</span
            ><span class="touch-guide">左手拖动 · 右手跳跃</span><br />按住跳得更高，空中再按可二段跳。
          </p>
          <p id="loading-error" role="alert" hidden></p>
        </section>
        <section id="select-panel" class="panel" aria-labelledby="select-title" hidden>
          <h2 id="select-title">选择关卡</h2>
          <div id="chapter-tabs" class="chapter-tabs" role="group" aria-label="选择世界"></div>
          <div id="stage-list" class="stage-list"></div>
          <button class="secondary home" type="button">返回标题</button>
        </section>
        <section id="pause-panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
          <h2 id="pause-title">已暂停</h2>
          <div class="menu-actions">
            <button id="resume" class="primary" type="button">继续冒险</button>
            <button id="restart" class="secondary" type="button">从检查点重试</button>
            <button class="secondary home" type="button">返回标题</button>
          </div>
        </section>
        <section
          id="story-panel"
          class="panel story-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="story-title"
          hidden
        >
          <p id="story-kicker" class="story-kicker"></p>
          <h2 id="story-title"></h2>
          <p id="story-speaker" class="story-speaker"></p>
          <p id="story-text"></p>
          <button id="story-continue" class="primary" type="button">继续</button>
        </section>
        <section id="clear-panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="clear-title" hidden>
          <h2 id="clear-title">关卡完成</h2>
          <p id="clear-summary"></p>
          <div class="menu-actions">
            <button id="next-stage" class="primary" type="button">下一关</button>
            <button id="replay" class="secondary" type="button">再玩本关</button>
            <button class="secondary home" type="button">返回标题</button>
          </div>
        </section>
      </div>
    </main>
    <script src="three.min.js"></script>
    <script src="models.js?v=5.0.0"></script>
    <script src="story.js?v=5.0.0"></script>
    <script src="stages.js?v=5.0.0"></script>
    <script src="expedition.js?v=5.0.0"></script>
    <script src="highlands.js?v=5.0.0"></script>
    <script src="campaign.js?v=5.0.0"></script>
    <script src="platformer.js?v=5.0.0"></script>
    <script src="autoplay.js?v=5.0.0"></script>
    <script src="journey-renderer.js?v=5.0.0"></script>
    <script src="journey.js?v=5.0.0"></script>
  </body>
</html>
